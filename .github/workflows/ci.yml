# 白小纯桌宠 · 三系统自动化测试
# 每次推送都会在三大系统上自动跑单元测试和冒烟测试；也可以在 Actions 页面手动运行。
# 每个系统先跑单元测试，再真正启动桌宠跑一遍冒烟测试（截图作为附件保留 7 天）。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: 单元测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # npm 11 起默认不执行依赖的安装脚本，Electron 的二进制要手动补一次（低版本 npm 下重复执行也无妨）
      - run: node node_modules/electron/install.js
      - run: npm test

  smoke:
    name: 冒烟测试 (${{ matrix.os }})
    needs: unit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 Linux 图形库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libgbm1 xvfb || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: 启动桌宠并跑冒烟测试（Windows / macOS）
        if: runner.os != 'Linux'
        env:
          BXC_PET_SELFTEST: .smoke
        run: npx electron .
      - name: 启动桌宠并跑冒烟测试（Linux，虚拟显示器）
        if: runner.os == 'Linux'
        env:
          BXC_PET_SELFTEST: .smoke
        run: xvfb-run -a npx electron .
      - name: 上传截图和测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ runner.os }}
          path: .smoke/
          retention-days: 7
          if-no-files-found: ignore
