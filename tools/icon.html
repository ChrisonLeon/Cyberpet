<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>icon</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; -webkit-user-select: none; }
    body {
      --fur: #1b1a20; --fur-hi: #37363f; --fur-line: #4a4956; --patch: #8f9bb4; --arm: #1b1a20;
      --paw: #fff; --paw-line: #c5cfe2; --pad: #ffaec6; --collar: #3d7bf2; --collar-hi: #a6c3ff;
      --tail: #1b1a20; --tail-tip: #1b1a20; --tail-hi: #4d4c59;
    }
    #app { position: absolute; left: 0; top: 0; width: 1024px; height: 1024px; }
    /* 暗黑桌面：深夜蓝黑渐变底，黑猫在暗色键盘上敲字 */
    #app .bg {
      position: absolute; inset: 0; border-radius: 228px;
      background: linear-gradient(165deg, #323a4f 0%, #1d2330 46%, #10131c 100%);
    }
    #app .glow {
      position: absolute; left: 132px; top: 60px; width: 760px; height: 760px; border-radius: 50%;
      background: radial-gradient(circle, rgba(91, 150, 255, .30) 0%, rgba(91, 150, 255, 0) 66%);
    }
    #app .sheen {
      position: absolute; left: 60px; top: 40px; width: 520px; height: 300px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255, 255, 255, .10) 0%, rgba(255, 255, 255, 0) 70%);
    }
    #app .floor {
      position: absolute; left: 182px; top: 880px; width: 660px; height: 110px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0, 0, 0, .55) 0%, rgba(0, 0, 0, 0) 70%);
    }
    #app .kb { position: absolute; left: 162px; top: 712px; width: 700px; height: 257px; }
    #app .kb .sil { fill: #fff; stroke: #fff; stroke-width: 4; }
    /* 暗夜键盘配色（与桌宠 dark 桌面一致，键帽微亮、功能键蓝） */
    #app .kb .kb-case { fill: #0d1119; }
    #app .kb .kb-plate { fill: #151a26; }
    #app .kb .key .side { fill: #1c2231; }
    #app .kb .key .cap { fill: #303950; }
    #app .kb .key text { fill: #c9d4ea; }
    #app .kb .key.accent .side { fill: #24406f; }
    #app .kb .key.accent .cap { fill: #3d7bf2; }
    #app .kb .key.accent text { fill: #fff; }
    #app .kb .key.soft .side { fill: #2a3c66; }
    #app .kb .key.soft .cap { fill: #3a5590; }
    #app .kb .key.accent.kcap-lit .cap { fill: #ffd86b; transform: translateY(3.2px); }
    #app .paws { position: absolute; inset: 0; }
    #app .torso { position: absolute; left: 345px; top: 470px; width: 500px; height: 275px; }
    #app .string { fill: none; stroke: #f4f6fb; stroke-width: 2; stroke-linecap: round; }
    #app .aglet { fill: #cfd6e6; }
    #app .collar { fill: none; stroke: var(--collar); stroke-width: 9; stroke-linecap: round; }
    #app .collar-hi { fill: none; stroke: var(--collar-hi); stroke-width: 2; stroke-linecap: round; opacity: .75; }
    #app .bell-slit { fill: none; stroke: #b9800a; stroke-width: 1.6; stroke-linecap: round; }
    #app .paw-body { fill: var(--paw); stroke: var(--paw-line); stroke-width: 1.5; }
    #app .pad { fill: var(--pad); }
    #app .head { position: absolute; left: 332px; top: 150px; width: 360px; height: 356px; }
    /* 黑猫配色（与桌宠 black 身子一致） */
    #app .ear, #app .face { fill: #1b1a20; }
    #app .ear-in { fill: #6b4a5c; }
    #app .iris { fill: #e9f76a; }
    #app .pupil { fill: #15151a; }
    #app .glint { fill: #fff; }
    #app .blush { fill: #ff9db5; opacity: .5; }
    #app .nose { fill: #ff9db5; }
    #app .mouth { fill: none; stroke: #f4f4f8; stroke-width: 1.8; stroke-linecap: round; }
    #app .whisk { fill: none; stroke: #9a99a6; stroke-width: 1.5; stroke-linecap: round; }
    #app .ghost, #app .photo { position: absolute; inset: 0; width: 100%; height: 100%; }
    #app .ghost {
      filter: brightness(0) invert(1)
        drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff)
        drop-shadow(3px 3px 0 #fff) drop-shadow(-3px 3px 0 #fff) drop-shadow(3px -3px 0 #fff) drop-shadow(-3px -3px 0 #fff)
        drop-shadow(0 12px 16px rgba(0, 0, 0, .42));
    }
    .art { position: absolute; left: 0; top: 0; overflow: hidden; }
    #view { position: absolute; left: 0; top: 0; }
  </style>
</head>
<body>
  <div id="view"></div>
  <script src="../src/renderer/shared/art.js"></script>
  <script>
    const ART = window.BXC_ART;
    const HEAD = '../assets/heads/bxc-default.png';
    // 菜单栏模板图标：黑猫头剪影，眼睛镂空（evenodd）
    const TRAY_HEAD = 'M4.2 8.6 L3.2 1.6 Q3.1 0.6 4 1.2 L9.2 4.6 Q11 4.1 12.8 4.6 L18 1.2 Q18.9 0.6 18.8 1.6 L17.8 8.6 Q20.6 11 20.6 14.4 Q20.6 21 11 21 Q1.4 21 1.4 14.4 Q1.4 11 4.2 8.6 Z';
    const EYE = (cx) => `M${cx - 1.5} 13.4 a1.5 1.9 0 1 0 3 0 a1.5 1.9 0 1 0 -3 0 Z`;

    function appIcon() {
      // 暗黑桌面 logo：黑猫在暗夜键盘上敲字（左 Shift 键帽亮起下压，像正按下去）
      const tail = ART.tailPathD(10, 16);
      const torso = ART.torsoMarkup('black')
        .replace('id="tailSil"', `id="tailSil" d="${tail.d}"`)
        .replace('id="tailColor"', `id="tailColor" d="${tail.d}"`)
        .replace('id="tailTipC"', `id="tailTipC" d="${tail.dTip}"`);
      const paw = ART.pawMarkup('black');
      const head = ART.cartoonHeadMarkup();
      const kb = ART.keyboardSvg(false)
        .replace('<g class="key accent" data-k="shift">', '<g class="key accent kcap-lit" data-k="shift">');
      return `<div id="app">
        <div class="bg"></div><div class="glow"></div><div class="sheen"></div><div class="floor"></div>
        <svg class="torso" viewBox="0 0 240 132">${torso}</svg>
        <svg class="kb" viewBox="0 0 300 110">${kb}</svg>
        <svg class="paws" viewBox="0 0 1024 1024">
          <g transform="translate(455 878) scale(2.5)">${paw}</g>
          <g transform="translate(583 878) scale(2.5)">${paw}</g>
        </svg>
        <div class="head"><svg viewBox="0 0 160 158" style="width:100%;height:100%">${head}</svg></div>
      </div>`;
    }

    function trayTemplate(size) {
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 22 22">
        <path fill="#000" fill-rule="evenodd" d="${TRAY_HEAD} ${EYE(7.2)} ${EYE(14.8)}"/></svg>`;
    }

    function trayColor(size) {
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 22 22">
        <path fill="#fff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" d="${TRAY_HEAD}"/>
        <path fill="#1b1a20" d="${TRAY_HEAD}"/>
        <ellipse cx="7.2" cy="13.2" rx="1.7" ry="2.1" fill="#e9f76a"/><ellipse cx="14.8" cy="13.2" rx="1.7" ry="2.1" fill="#e9f76a"/>
        <ellipse cx="7.2" cy="13.3" rx=".6" ry="1.5" fill="#15151a"/><ellipse cx="14.8" cy="13.3" rx=".6" ry="1.5" fill="#15151a"/>
        <path d="M10.3 16.6 Q11 17.4 11.7 16.6" fill="none" stroke="#fff" stroke-width=".7" stroke-linecap="round"/></svg>`;
    }

    window.show = (kind) => {
      const view = document.getElementById('view');
      if (kind === 'app') view.innerHTML = appIcon();
      else if (kind === 'tray') view.innerHTML = `<div class="art" style="width:22px;height:22px">${trayTemplate(22)}</div>`;
      else if (kind === 'tray2x') view.innerHTML = `<div class="art" style="width:44px;height:44px">${trayTemplate(44)}</div>`;
      else view.innerHTML = `<div class="art" style="width:128px;height:128px">${trayColor(128)}</div>`;
      return Promise.all([...view.querySelectorAll('img')].map((img) => (img.complete ? 1 : new Promise((r) => { img.onload = img.onerror = r; }))));
    };
  </script>
</body>
</html>
